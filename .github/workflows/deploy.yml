name: Build and deploy to cPanel

# Deploys the static site to cPanel over FTP on every push to main.
# Requires three repository secrets (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER    e.g. ftp.monrepossokobanja.com  (or the server hostname/IP)
#   FTP_USERNAME  your FTP account username
#   FTP_PASSWORD  your FTP account password

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you run it manually from the Actions tab

concurrency:
  group: cpanel-deploy
  cancel-in-progress: false # never interrupt an in-progress upload

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site (output -> out/)
        run: npm run build

      - name: Deploy out/ to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps # secure FTP; change to "ftp" only if your host has no FTPS
          local-dir: ./out/
          # This FTP account is rooted at public_html, so "./" IS the web root.
          # (If you ever switch to the main cPanel account, use "./public_html/".)
          server-dir: ./
